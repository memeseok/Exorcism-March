<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>주먹 퇴마사 · Exorcism March</title>
    <link rel="icon" href="data:,">
    <style>
      @font-face { font-family: "Galmuri11"; src: url("Galmuri11.woff2") format("woff2"); }
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #050304; overflow: hidden; }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #050304; outline: none; }
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
              color: #c9b48a; font-family: "Galmuri11", monospace; font-size: 22px; letter-spacing: 1px; pointer-events: none;
              image-rendering: pixelated; }
      #boot .bar { width: 240px; height: 6px; margin-top: 14px; background: #1b1214; }
      #boot .fill { height: 100%; width: 0%; background: #c9b48a; }
      #boot .err { color: #e05a4a; font-size: 16px; max-width: 70vw; text-align: center; margin-top: 12px; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="boot"><div>성수를 데우는 중</div><div class="bar"><div class="fill" id="boot-fill"></div></div><div class="err" id="boot-err"></div></div>
    <script src="pose/pose-bridge.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Web.data.unityweb",
        frameworkUrl: buildUrl + "/Web.framework.js.unityweb",
        codeUrl: buildUrl + "/Web.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Kopfkino",
        productName: "ExorcismMarch",
        productVersion: "1108-2331",
        showBanner: function (msg, type) { if (type === 'error') document.getElementById('boot-err').textContent = msg; console.warn(msg); },
      };
      // Final check 11-07: a judge will double-click this file first. Say what to open instead.
      var away = function () { if (window.exoUnity) window.exoUnity.SendMessage('GameRoot', 'PageAway'); };
      window.addEventListener('blur', away);
      document.addEventListener('visibilitychange', function () { if (document.hidden) away(); });
      var opened = location.protocol === 'file:';
      if (opened) {
        document.querySelector('#boot > div').textContent = '이 파일을 직접 열면 실행되지 않아요';
        document.querySelector('#boot .bar').style.display = 'none';
        document.getElementById('boot-err').textContent = '같은 폴더의 실행 파일을 더블클릭해 주세요. (맥: 주먹퇴마사_실행.command · 윈도우: 주먹퇴마사_실행.bat)';
      }
      var script = document.createElement("script");
      script.src = buildUrl + "/Web.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (p) {
          document.getElementById('boot-fill').style.width = (100 * p) + "%";
        }).then(function (instance) {
          document.getElementById('boot').style.display = 'none';
          window.exoUnity = instance;
          canvas.focus();
        }).catch(function (message) {
          document.getElementById('boot-err').textContent = 'Chrome이나 Edge로 열어 주세요. (' + String(message) + ')';
        });
      };
      if (!opened) document.body.appendChild(script);
      // Keyboard focus follows the pointer so the keyboard fallback works without hunting for the canvas.
      window.addEventListener('pointerdown', function () { canvas.focus(); });
    </script>
  </body>
</html>
